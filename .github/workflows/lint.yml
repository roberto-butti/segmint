name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Print Tool Versions
        run: bun --version

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Run Pint
        run: composer lint:check

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Check Frontend
        run: |
          bun run format:check
          bun run lint:check
          bun run types:check

  npm-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Print Tool Versions
        run: |
          node --version
          npm --version
          cat .nvmrc

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Print Npm Compatibility Details
        run: |
          npm ls eslint --depth=0
          npm exec -- eslint -v

      - name: Check Frontend
        run: |
          npm run format:check
          npm run lint:check
          npm run types:check
          npm run build
